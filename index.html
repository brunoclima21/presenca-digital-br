  function renderBooking(){const prior=data.draft||{};const locations=data.locations||initial.locations;let unit=locations.find(x=>x.id===prior.unit)||locations[0];let pros=data.pros.filter(p=>!p.unit||p.unit===unit?.id);let service=data.services.find(x=>x.id===prior.service)||data.services[0],pro=pros.find(x=>x.id===prior.pro)||pros[0];if(!service||!pro||!unit){main.innerHTML='<div class="empty card"><div class="empty-icon">✂</div><h3>Estamos ajustando a agenda</h3><p>Volte em instantes ou fale diretamente com a barbearia.</p></div>';return}const slots=getSlots(selectedDate,pro,service);if(!slots.includes(selectedSlot))selectedSlot='';const selectedText=selectedSlot?`${selectedSlot} · ${dateFmt(selectedDate,{day:'numeric',month:'short'})}`:'Escolha uma data e horário';main.innerHTML=`<div class="page-head"><div><span class="eyebrow">Agendamento online</span><h1>Um tempo pra você.</h1><p>Escolha seu serviço, profissional e melhor horário.</p></div></div>

  function appointmentCard(a,admin){const s=data.services.find(x=>x.id===a.service),p=data.pros.find(x=>x.id===a.pro);let status=a.status==='cancelled'?'Cancelado':a.status==='done'?'Concluído':a.status==='noshow'?'Não compareceu':a.status==='blocked'?'Bloqueio':'Confirmado';return `<article class="card appointment" data-record="${a.id}"><div class="appt-date"><b>${esc(dateFmt(a.date,{day:'2-digit',month:'short'}))}</b><span>${a.time} · ${dur(a.duration)}</span></div><div class="appt-info"><h3>${esc(a.name)} <span class="status-badge ${a.status==='cancelled'?'cancelled':a.status==='done'?'done':a.status==='blocked'?'blocked':''}">${status}</span></h3><p>${esc(s?.name||'Horário bloqueado')} · ${esc(p?.name||'')} · ${money(a.price)}<br>${admin?`Telefone: ${esc(a.phone||'—')}${a.email?' · '+esc(a.email):''}`:`${esc(a.phone)}`}</p></div><div class="appt-actions">${!admin&&a.status==='confirmed'?`<button class="small-btn" data-reschedule="${a.id}">Remarcar</button><button class="small-btn" data-cancel="${a.id}">Cancelar</button>`:''}${admin&&a.status==='confirmed'?`<button class="small-btn" data-done="${a.id}">Concluir</button><button class="small-btn" data-noshow="${a.id}">Não veio</button><button class="small-btn" data-cancel="${a.id}">Cancelar</button>`:''}${admin&&a.status==='done'?`<button class="small-btn" data-confirm="${a.id}">Reabrir</button>`:''}${admin&&a.status==='blocked'?`<button class="small-btn" data-unblock="${a.id}">Desbloquear</button>`:''}</div></article>`}
  function bindAppointmentButtons(){document.querySelectorAll('[data-unblock]').forEach(b=>b.onclick=()=>{data.blocks=data.blocks.filter(x=>x.id!==b.dataset.unblock);save();renderAdmin();toast('Bloqueio removido.')});document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>confirmCancel(b.dataset.cancel));document.querySelectorAll('[data-reschedule]').forEach(b=>b.onclick=()=>startReschedule(b.dataset.reschedule));document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>setStatus(b.dataset.done,'done'));document.querySelectorAll('[data-noshow]').forEach(b=>b.onclick=()=>setStatus(b.dataset.noshow,'noshow'));document.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>setStatus(b.dataset.confirm,'confirmed'))}
  function confirmCancel(id){const a=data.appointments.find(x=>x.id===id);if(!a)return;document.querySelector('#overlay').innerHTML=`<div class="modal-backdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="cancel-title"><h2 id="cancel-title">Cancelar este horário?</h2><p>O atendimento de ${esc(dateFmt(a.date))} às ${a.time} será cancelado. Esta ação não pode ser desfeita neste protótipo.</p><div class="modal-actions"><button class="secondary" id="keep">Manter horário</button><button class="danger" id="do-cancel">Sim, cancelar</button></div></section></div>`;document.querySelector('#keep').onclick=()=>document.querySelector('#overlay').innerHTML='';document.querySelector('#do-cancel').onclick=()=>{a.status='cancelled';save();document.querySelector('#overlay').innerHTML='';render();toast('Agendamento cancelado.')}}
  function startReschedule(id){editingId=id;const a=data.appointments.find(x=>x.id===id);if(!a)return;selectedDate=a.date;selectedSlot='';const pr=data.pros.find(p=>p.id===a.pro);data.draft={name:a.name,phone:a.phone,email:a.email,service:a.service,pro:pr?.id||''};save();setPage('booking');toast('Escolha um novo dia e horário. O horário atual continua reservado até concluir a remarcação.')}
  function setStatus(id,status){let a=data.appointments.find(x=>x.id===id);if(a){a.status=status;save();render();toast(status==='done'?'Atendimento concluído.':status==='noshow'?'Status atualizado.':'Agendamento atualizado.')}}
  function renderAdmin(){main.innerHTML=`<div class="page-head"><div><span class="eyebrow">Área da barbearia · demonstração</span><h1>Visão da barbearia</h1><p>Gerencie a agenda e os dados de demonstração neste dispositivo.</p></div><span class="status-badge">Dados locais</span></div><div class="admin-tabs">${[['appointments','Agendamentos'],['services','Serviços'],['team','Profissionais'],['hours','Expediente'],['clients','Clientes']].map(([k,n])=>`<button data-admin="${k}" class="${adminTab===k?'active':''}">${n}</button>`).join('')}</div><div id="admin-body"></div>`;document.querySelectorAll('[data-admin]').forEach(b=>b.onclick=()=>{adminTab=b.dataset.admin;renderAdmin()});let el=document.querySelector('#admin-body');if(adminTab==='appointments')adminAppointments(el);if(adminTab==='services')adminServices(el);if(adminTab==='team')adminTeam(el);if(adminTab==='hours')adminHours(el);if(adminTab==='clients')adminClients(el)}
  function adminAppointments(el){let arr=[...data.appointments,...data.blocks].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));el.innerHTML=`<div class="toolbar"><h2>Agenda de atendimentos</h2><div class="actions"><input type="date" class="mini-select" id="filter-date" value="${today()}"><button class="secondary" id="block-time">＋ Bloquear horário</button></div></div><div id="cal"></div><div class="appointment-list" style="margin-top:14px">${arr.length?arr.map(a=>appointmentCard(a,true)).join(''):'<div class="card empty"><h3>Agenda vazia</h3><p>Os novos agendamentos aparecerão aqui.</p></div>'}</div>`;const cal=document.querySelector('#cal'),days=[];for(let i=-2;i<5;i++){let d=new Date();d.setDate(d.getDate()+i);days.push(d)}cal.innerHTML=`<div class="week-strip">${days.map(d=>{const iso=dayISO(d);return `<button class="day-pick ${iso===document.querySelector('#filter-date').value?'active':''}" data-day="${iso}">${new Intl.DateTimeFormat('pt-BR',{weekday:'short'}).format(d)}<b>${d.getDate()}</b></button>`}).join('')}</div>`;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{document.querySelector('#filter-date').value=b.dataset.day;document.querySelectorAll('[data-day]').forEach(x=>x.classList.toggle('active',x===b));filterAdmin()});document.querySelector('#filter-date').onchange=filterAdmin;function filterAdmin(){let d=document.querySelector('#filter-date').value;document.querySelectorAll('.appointment').forEach(card=>{let a=[...data.appointments,...data.blocks].find(x=>x.id===card.dataset.record);card.classList.toggle('hide',!a||a.date!==d)})}filterAdmin();document.querySelector('#block-time').onclick=()=>blockDialog();bindAppointmentButtons()}
  function blockDialog(){document.querySelector('#overlay').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><h2>Bloquear horário</h2><p>Reserve um período para pausa, compromisso ou indisponibilidade.</p><div class="field-grid"><div class="field"><label>Profissional</label><select id="b-pro">${selectOptions(data.pros,'','Selecione')}</select></div><div class="field"><label>Data</label><input id="b-date" type="date" min="${today()}" value="${today()}"></div><div class="field"><label>Início</label><input id="b-time" type="time" value="13:00"></div><div class="field"><label>Duração</label><select id="b-duration"><option value="30">30 minutos</option><option value="60">1 hora</option><option value="90">1h30</option><option value="120">2 horas</option></select></div></div><div class="modal-actions"><button class="secondary" id="b-close">Voltar</button><button class="primary" id="b-save">Bloquear</button></div></section></div>`;document.querySelector('#b-close').onclick=()=>document.querySelector('#overlay').innerHTML='';document.querySelector('#b-save').onclick=()=>{let p=document.querySelector('#b-pro').value,d=document.querySelector('#b-date').value,t=document.querySelector('#b-time').value,n=Number(document.querySelector('#b-duration').value);if(!p||!d||!t){toast('Preencha profissional, data e início.');return}let [h,m]=t.split(':').map(Number),end=h*60+m+n;if(end>1440){toast('O bloqueio deve terminar no mesmo dia.');return}let overlaps=[...data.appointments.filter(a=>a.status==='confirmed'),...data.blocks].some(a=>a.date===d&&a.pro===p&&h*60+m<Number(a.time.slice(0,2))*60+Number(a.time.slice(3))+a.duration&&end>Number(a.time.slice(0,2))*60+Number(a.time.slice(3))); if(overlaps){toast('Este horário cruza um atendimento confirmado.');return}data.blocks.push({id:String(Date.now()),pro:p,date:d,time:t,duration:n,status:'blocked',name:'Indisponível',price:0});save();document.querySelector('#overlay').innerHTML='';renderAdmin();toast('Horário bloqueado.')}}
  function adminServices(el){el.innerHTML=`<div class="toolbar"><h2>Serviços e valores</h2><div class="actions"><button class="primary" id="add-service">＋ Novo serviço</button></div></div><div class="card table-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Serviço</th><th>Duração</th><th>Preço</th><th>Ações</th></tr></thead><tbody>${data.services.map(s=>`<tr><td><strong>${esc(s.name)}</strong></td><td>${dur(s.duration)}</td><td>${money(s.price)}</td><td><button class="small-btn" data-edit-service="${s.id}">Editar</button> <button class="small-btn" data-del-service="${s.id}">Remover</button></td></tr>`).join('')}</tbody></table></div></div>`;document.querySelector('#add-service').onclick=()=>serviceDialog();document.querySelectorAll('[data-edit-service]').forEach(b=>b.onclick=()=>serviceDialog(b.dataset.editService));document.querySelectorAll('[data-del-service]').forEach(b=>b.onclick=()=>{let id=b.dataset.delService;if(data.appointments.some(a=>a.service===id&&a.status==='confirmed')){toast('Há agendamentos ativos vinculados a este serviço.');return}data.services=data.services.filter(s=>s.id!==id);save();renderAdmin()})}
  function serviceDialog(id){const s=data.services.find(x=>x.id===id)||{name:'',duration:30,price:0};document.querySelector('#overlay').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><h2>${id?'Editar serviço':'Novo serviço'}</h2><div class="field-grid"><div class="field full"><label>Nome do serviço</label><input id="s-name" value="${esc(s.name)}" placeholder="Ex.: Corte tradicional"></div><div class="field"><label>Duração (minutos)</label><input id="s-duration" type="number" min="15" step="5" value="${s.duration}"></div><div class="field"><label>Preço (R$)</label><input id="s-price" type="number" min="0" step="1" value="${s.price}"></div></div><div class="modal-actions"><button class="secondary" id="s-close">Voltar</button><button class="primary" id="s-save">Salvar serviço</button></div></section></div>`;document.querySelector('#s-close').onclick=()=>document.querySelector('#overlay').innerHTML='';document.querySelector('#s-save').onclick=()=>{let name=document.querySelector('#s-name').value.trim(),duration=Number(document.querySelector('#s-duration').value),price=Number(document.querySelector('#s-price').value);if(!name||!Number.isFinite(duration)||duration<15||!Number.isFinite(price)||price<0){toast('Confira nome, duração e preço.');return}if(id)Object.assign(s,{name,duration,price});else data.services.push({id:'s'+Date.now(),name,duration,price});save();document.querySelector('#overlay').innerHTML='';renderAdmin()}}
  function adminTeam(el){el.innerHTML=`<div class="toolbar"><h2>Profissionais</h2><div class="actions"><button class="primary" id="add-pro">＋ Novo profissional</button></div></div><div class="card table-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Profissional</th><th>Especialidade</th><th>Dias de atendimento</th><th>Ações</th></tr></thead><tbody>${data.pros.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${esc(p.role)}</td><td>${p.days.map(d=>['dom','seg','ter','qua','qui','sex','sáb'][d]).join(', ')}</td><td><button class="small-btn" data-edit-pro="${p.id}">Editar</button> <button class="small-btn" data-del-pro="${p.id}">Remover</button></td></tr>`).join('')}</tbody></table></div></div>`;document.querySelector('#add-pro').onclick=()=>proDialog();document.querySelectorAll('[data-edit-pro]').forEach(b=>b.onclick=()=>proDialog(b.dataset.editPro));document.querySelectorAll('[data-del-pro]').forEach(b=>b.onclick=()=>{let id=b.dataset.delPro;if(data.appointments.some(a=>a.pro===id&&a.status==='confirmed')){toast('Este profissional tem agendamentos ativos.');return}data.pros=data.pros.filter(p=>p.id!==id);save();renderAdmin()})}
  function proDialog(id){let p=data.pros.find(x=>x.id===id)||{name:'',role:'Barbeiro',days:[1,2,3,4,5,6]};document.querySelector('#overlay').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><h2>${id?'Editar profissional':'Novo profissional'}</h2><div class="field-grid"><div class="field full"><label>Nome</label><input id="p-name" value="${esc(p.name)}"></div><div class="field full"><label>Especialidade</label><input id="p-role" value="${esc(p.role)}"></div><div class="field full"><label>Dias de atendimento</label><div style="display:flex;gap:7px;flex-wrap:wrap">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map((d,i)=>`<label style="font-size:11px;font-weight:500"><input type="checkbox" value="${i}" class="p-day" ${p.days.includes(i)?'checked':''}> ${d}</label>`).join('')}</div></div></div><div class="modal-actions"><button class="secondary" id="p-close">Voltar</button><button class="primary" id="p-save">Salvar</button></div></section></div>`;document.querySelector('#p-close').onclick=()=>document.querySelector('#overlay').innerHTML='';document.querySelector('#p-save').onclick=()=>{let name=document.querySelector('#p-name').value.trim(),role=document.querySelector('#p-role').value.trim(),days=[...document.querySelectorAll('.p-day:checked')].map(x=>Number(x.value));if(!name||!days.length){toast('Informe o nome e pelo menos um dia de atendimento.');return}if(id)Object.assign(p,{name,role,days});else data.pros.push({id:'p'+Date.now(),name,role,days});save();document.querySelector('#overlay').innerHTML='';renderAdmin()}}
  function adminHours(el){el.innerHTML=`<div class="toolbar"><h2>Expediente e exceções</h2></div><div class="card form-card" style="margin-bottom:14px"><div class="field-grid"><div class="field"><label>Abre às</label><input id="h-start" type="time" value="${data.hours.start}"></div><div class="field"><label>Fecha às</label><input id="h-end" type="time" value="${data.hours.end}"></div><div class="field"><label>Pausa começa</label><input id="h-bs" type="time" value="${data.hours.breakStart}"></div><div class="field"><label>Pausa termina</label><input id="h-be" type="time" value="${data.hours.breakEnd}"></div><div class="field full"><label>Dias fechados</label><div style="display:flex;gap:8px;flex-wrap:wrap">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map((d,i)=>`<label style="font-size:12px"><input class="closed-day" type="checkbox" value="${i}" ${(data.hours.closed||[]).includes(i)?'checked':''}> ${d}</label>`).join('')}</div></div><div class="field"><label>Adicionar feriado</label><input type="date" id="holiday-date" min="${today()}"></div><div class="field" style="align-self:end"><button class="secondary" id="add-holiday">＋ Adicionar data fechada</button></div></div><div style="margin-top:17px"><button class="primary" id="save-hours">Salvar expediente</button></div></div><div class="card table-card"><div class="table-head"><h2>Feriados cadastrados</h2><p>Dias adicionais sem atendimento.</p></div>${data.holidays.length?data.holidays.map(d=>`<div style="padding:11px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:12px">${esc(dateFmt(d))}<button class="small-btn" data-del-holiday="${d}">Remover</button></div>`).join(''):'<p class="muted" style="padding:0 16px 15px">Nenhum feriado definido.</p>'}</div><div class="toolbar" style="margin-top:22px"><h2>Horários bloqueados</h2></div><div class="appointment-list">${data.blocks.length?data.blocks.map(a=>appointmentCard(a,true)).join(''):'<p class="muted">Sem bloqueios registrados.</p>'}</div>`;document.querySelector('#save-hours').onclick=()=>{const h1=document.querySelector('#h-start').value,h2=document.querySelector('#h-end').value,b1=document.querySelector('#h-bs').value,b2=document.querySelector('#h-be').value;if(!h1||!h2||h1>=h2||!b1||!b2||b1>=b2||b1<h1||b2>h2){toast('Confira o expediente e a pausa.');return}const closed=[...document.querySelectorAll('.closed-day:checked')].map(x=>Number(x.value));data.hours={start:h1,end:h2,breakStart:b1,breakEnd:b2,closed,weekly:Array.from({length:7},(_,i)=>closed.includes(i)?null:{start:h1,end:h2})};save();toast('Expediente atualizado.');renderAdmin()};document.querySelector('#add-holiday').onclick=()=>{let d=document.querySelector('#holiday-date').value;if(!d){toast('Escolha uma data.');return}if(!data.holidays.includes(d))data.holidays.push(d);save();renderAdmin()};document.querySelectorAll('[data-del-holiday]').forEach(b=>b.onclick=()=>{data.holidays=data.holidays.filter(x=>x!==b.dataset.delHoliday);save();renderAdmin()});document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{data.blocks=data.blocks.filter(x=>x.id!==b.dataset.cancel);save();renderAdmin();toast('Bloqueio removido.')})}
  function adminClients(el){const map=new Map();data.appointments.forEach(a=>{if(!map.has(a.phone))map.set(a.phone,{name:a.name,phone:a.phone,email:a.email,visits:0,last:'',total:0});let c=map.get(a.phone);if(a.status==='done')c.visits++;if(a.date>c.last)c.last=a.date;c.total++});const clients=[...map.values()].sort((a,b)=>b.visits-a.visits);el.innerHTML=`<div class="toolbar"><h2>Clientes</h2><span class="muted" style="font-size:11px">${clients.length} cadastro(s) da demonstração</span></div>${clients.length?`<div class="card table-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Cliente</th><th>Telefone</th><th>E-mail</th><th>Visitas concluídas</th><th>Último agendamento</th></tr></thead><tbody>${clients.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.phone)}</td><td>${esc(c.email||'—')}</td><td>${c.visits}</td><td>${c.last?esc(dateFmt(c.last,{day:'numeric',month:'short',year:'numeric'})):'—'}</td></tr>`).join('')}</tbody></table></div></div>`:`<div class="card empty"><div class="empty-icon">♙</div><h3>A lista de clientes está vazia</h3><p>Os clientes aparecem aqui depois de agendarem pelo fluxo de demonstração.</p></div>`}<p class="fineprint" style="text-align:left;margin-top:12px">Dados demonstrativos guardados localmente neste dispositivo.</p>`}
  render();
})();
</script>
</body>
</html>
